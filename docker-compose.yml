services:
  island:
    image: aciddensity/arkcluster:latest
    deploy:
      mode: global
    environment:
      CRON_AUTO_UPDATE: "0 */3 * * *"
      CRON_AUTO_BACKUP: "0 */1 * * *"
      UPDATEONSTART: 1
      BACKUPONSTART: 1
      BACKUPONSTOP: 1
      WARNONSTOP: 1
      USER_ID: 1000
      GROUP_ID: 1000
      TZ: "UTC"
      MAX_BACKUP_SIZE: 500
      SERVERMAP: "TheIsland"
      SESSION_NAME: "ARK Cluster TheIsland"
      MAX_PLAYERS: 15
      RCON_ENABLE: "True"
      QUERY_PORT: 15000
      GAME_PORT: 15002
      RCON_PORT: 15003
      SERVER_PVE: "False"
      SERVER_PASSWORD_FILE: "/run/secrets/server_password"
      ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
      SPECTATOR_PASSWORD_FILE: "/run/secrets/spectator_password"
      MODS: "731604991"
      CLUSTER_ID: "myclusterid"
      GAME_USERSETTINGS_INI_PATH: "/cluster/myclusterid.GameUserSettings.ini"
      GAME_INI_PATH: "/cluster/myclusterid.Game.ini"
    volumes:
      - data_island:/ark
      - cluster:/cluster
    secrets:
      - server_password
      - admin_password
      - spectator_password
    ports:
      - "15000-15003:15000-15003/udp"
      - "15003:15003/tcp"

  valguero:
    image: aciddensity/arkcluster:latest
    deploy:
      mode: global
    environment:
      CRON_AUTO_UPDATE: "15 */3 * * *"
      CRON_AUTO_BACKUP: "15 */1 * * *"
      UPDATEONSTART: 1
      BACKUPONSTART: 1
      BACKUPONSTOP: 1
      WARNONSTOP: 1
      USER_ID: 1000
      GROUP_ID: 1000
      TZ: "UTC"
      MAX_BACKUP_SIZE: 500
      SERVERMAP: "Valguero_P"
      SESSION_NAME: "ARK Cluster Valguero"
      MAX_PLAYERS: 15
      RCON_ENABLE: "False"
      QUERY_PORT: 15010
      GAME_PORT: 15012
      RCON_PORT: 15013
      SERVER_PVE: "False"
      SERVER_PASSWORD_FILE: "/run/secrets/server_password"
      ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
      SPECTATOR_PASSWORD_FILE: "/run/secrets/spectator_password"
      MODS: "731604991"
      CLUSTER_ID: "myclusterid"
      GAME_USERSETTINGS_INI_PATH: "/cluster/myclusterid.GameUserSettings.ini"
      GAME_INI_PATH: "/cluster/myclusterid.Game.ini"
    volumes:
      - data_valguero:/ark
      - cluster:/cluster
    secrets:
      - server_password
      - admin_password
      - spectator_password
    ports:
      - "15010-15013:15010-15013/udp"
      - "15013:15013/tcp"

volumes:
  data_island:
  data_valguero:
  cluster:

secrets:
  server_password:
    file: ./secrets/server_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
  spectator_password:
    file: ./secrets/spectator_password.txt
